<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI デバイス統合チェックリスト</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #f4f7f6;
            --border: #ccc;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--secondary);
            margin: 0; padding: 20px; color: #333;
        }
        .container {
            max-width: 900px; margin: auto; background: white;
            padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 { text-align: center; color: var(--primary); }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        .home-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-top: 20px;
        }
        .btn-card {
            background: #fff; border: 2px solid var(--primary); color: var(--primary);
            padding: 20px; text-align: center; border-radius: 8px; font-weight: bold;
            font-size: 1.2em; cursor: pointer; transition: 0.2s;
        }
        .btn-card:hover { background: var(--primary); color: white; }
        .btn-card.disabled { background: #eee; border-color: #aaa; color: #aaa; cursor: not-allowed; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        
        .tabs { display: flex; flex-wrap: wrap; border-bottom: 2px solid var(--primary); margin-bottom: 20px; }
        .tab { 
            padding: 10px 20px; cursor: pointer; background: #e9ecef; 
            border: 1px solid var(--border); border-bottom: none;
            border-radius: 5px 5px 0 0; margin-right: 5px; font-weight: bold;
        }
        .tab.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .patient-info { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .patient-info label { font-weight: bold; font-size: 0.9em; display:block; margin-bottom: 5px;}
        .patient-info input[type="text"], .patient-info input[type="date"] { width: 90%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; }
        
        .check-item { display: flex; align-items: flex-start; margin-bottom: 12px; font-size: 1.1em; border-bottom: 1px dashed #eee; padding-bottom: 8px; }
        .check-item input[type="checkbox"] { transform: scale(1.5); margin-right: 15px; margin-top: 5px; }
        
        .measure-table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 15px; }
        .measure-table th, .measure-table td { border: 1px solid var(--border); padding: 8px; text-align: center; }
        .measure-table th { background: #f1f3f5; font-size: 0.9em; }
        .measure-input { width: 50px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius:3px; }
        
        .signature-wrapper { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 10px;}
        .signature-box { border: 2px dashed var(--border); width: 300px; height: 100px; background: #fff; cursor: crosshair; touch-action: none; }
        .sig-btn-group { display: flex; flex-direction: column; gap: 5px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-save { background: #28a745; }
        .btn-clear-sig { background: #dc3545; padding: 5px 10px; font-size: 0.8em; }
        .btn-export { background: #007bff; width: 100%; font-size: 1.2em; padding: 15px; margin-top: 30px; }
        
        .help-icon { 
            display: inline-block; width: 24px; height: 24px; background: #17a2b8; color: white; 
            border-radius: 50%; text-align: center; line-height: 24px; font-weight: bold; cursor: pointer; margin-left: 10px;
        }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        #modal img { max-width: 90%; max-height: 90%; border: 3px solid white; }
        
        .link-text { color: #007bff; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
        <h1>メーカー選択</h1>
        <div class="home-grid">
            <button class="btn-card" onclick="selectManufacturer('Boston')">Boston Scientific<br>(ボストン)</button>
            <button class="btn-card" onclick="selectManufacturer('Biotronik')">Biotronik<br>(バイオトロニック)</button>
            <button class="btn-card" onclick="selectManufacturer('Medtronic')">Medtronic<br>(メドトロニック)</button>
            <button class="btn-card" onclick="selectManufacturer('NihonKohden')">Nihon Kohden<br>(日本光電)</button>
        </div>
        <div style="margin-top: 30px; text-align: center;">
            <button class="btn" style="background:#6c757d; font-size:1.1em;" onclick="alert('全患者リスト画面は準備中です（データ構造整理後に開放します）')">🗂️ 全患者の保存データを確認</button>
        </div>
    </div>

    <!-- DEVICE SCREEN -->
    <div id="screen-device" class="screen">
        <div class="top-bar">
            <button class="btn-back" onclick="showScreen('screen-home')">← 戻る</button>
            <h2 id="selected-mfg-title"></h2>
            <div></div>
        </div>
        <h1>デバイス種類選択</h1>
        <div class="home-grid" id="device-btn-container">
            <button class="btn-card" onclick="selectDevice('PM')">PM (ペースメーカ)</button>
            <button class="btn-card" onclick="selectDevice('ICD_CRT')">ICD / CRT-D</button>
        </div>
    </div>

    <!-- CHECKLIST SCREEN -->
    <div id="screen-checklist" class="screen">
        <div class="top-bar">
            <button class="btn-back" onclick="showScreen('screen-device')">← 戻る</button>
            <h2 id="checklist-title">チェックリスト</h2>
            <button class="btn" style="background:#dc3545;" onclick="clearCurrentData()">データクリア</button>
        </div>

        <div class="patient-info">
            <div><label>患者ID</label><input type="text" id="patient-id" onchange="loadPatientData()" placeholder="入力後エンターで読み込み"></div>
            <div><label>患者名</label><input type="text" id="patient-name" onchange="autoSave()"></div>
            <div><label>MRI検査オーダー日</label><input type="date" id="exam-order-date" onchange="autoSave()"></div>
            <div><label>MRI検査実施日</label><input type="date" id="exam-exec-date" onchange="autoSave()"></div>
            <div style="grid-column: span 2;">
                <label>MRI対応カード画像 (表面) 📷</label>
                <input type="file" id="card-image-input" accept="image/*" capture="environment" onchange="handleImageUpload(event)">
                <img id="card-image-preview" style="display:none; max-height: 120px; margin-top: 10px; border:1px solid #ccc; border-radius:5px;" />
            </div>
        </div>

        <div class="tabs main-tabs">
            <div class="tab main-tab active" onclick="switchTab(this, 'tab1')">① オーダ前</div>
            <div class="tab main-tab" onclick="switchTab(this, 'tab2')">② 検査前</div>
            <div class="tab main-tab" onclick="switchTab(this, 'tab3')">③ 検査時</div>
            <div class="tab main-tab" onclick="switchTab(this, 'tab4')">④ 検査後</div>
        </div>

        <div id="tab1" class="tab-content active"><div id="check-list-1"></div></div>
        
        <div id="tab2" class="tab-content">
            <div id="check-list-2"></div>
            <div id="measurements-pre"></div>
            <div style="margin-top:20px;">
                <label>施行CE 署名:</label>
                <div class="signature-wrapper">
                    <canvas id="sig-ce" class="signature-box"></canvas>
                    <div class="sig-btn-group">
                        <button class="btn btn-save" id="btn-save-sig-ce" onclick="saveSignature('sig-ce')">✓ 保存</button>
                        <button class="btn btn-clear-sig" onclick="clearSignature('sig-ce')">× 消去</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="tab3" class="tab-content">
            <div id="check-list-3"></div>
            <div style="margin-top:20px;">
                <label>放射線技師 署名:</label>
                <div class="signature-wrapper">
                    <canvas id="sig-rad" class="signature-box"></canvas>
                    <div class="sig-btn-group">
                        <button class="btn btn-save" id="btn-save-sig-rad" onclick="saveSignature('sig-rad')">✓ 保存</button>
                        <button class="btn btn-clear-sig" onclick="clearSignature('sig-rad')">× 消去</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="tab4" class="tab-content">
            <div id="check-list-4"></div>
            <div id="measurements-post"></div>
            <div style="margin-top:20px;">
                <label>医師 署名:</label>
                <div class="signature-wrapper">
                    <canvas id="sig-doc" class="signature-box"></canvas>
                    <div class="sig-btn-group">
                        <button class="btn btn-save" id="btn-save-sig-doc" onclick="saveSignature('sig-doc')">✓ 保存</button>
                        <button class="btn btn-clear-sig" onclick="clearSignature('sig-doc')">× 消去</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tabs" style="margin-top: 30px; border-bottom: 2px solid var(--primary);">
            <div id="tab-btn-save" class="tab action-tab active" onclick="switchActionTab('action-save')">💾 一時保存</div>
            <div id="tab-btn-export" class="tab action-tab" onclick="switchActionTab('action-export')">📊 データ出力</div>
        </div>
        
        <div id="action-save" class="action-content active" style="padding: 15px; background: #fff; border: 1px solid var(--border); border-top: none; border-radius: 0 0 5px 5px; margin-bottom: 30px;">
            <p style="margin-top:0; font-size: 0.9em; color: #555;">現在の入力状態をブラウザに一時保存します。<br>※保存には患者IDの入力が必須です。</p>
            <button class="btn" style="background:#17a2b8; width: 100%; font-size: 1.2em; padding: 15px;" onclick="manualSave()">💾 データを一時保存する</button>
        </div>

        <div id="action-export" class="action-content" style="display:none; padding: 15px; background: #fff; border: 1px solid var(--border); border-top: none; border-radius: 0 0 5px 5px; margin-bottom: 30px;">
            <p style="margin-top:0; font-size: 0.9em; color: #555;">チェックリストをExcelファイルとしてダウンロードします。</p>
            <button class="btn btn-export" style="margin-top: 0; width: 100%; font-size: 1.2em; padding: 15px;" onclick="exportToExcel()">📊 Excel出力</button>
        </div>
    </div>
</div>

<!-- モーダル -->

    let currentMfg = '';
    let currentDevice = '';
    let isDrawing = false;
    let cardImageBase64 = "";

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function selectManufacturer(mfg) {
        currentMfg = mfg;
        let mfgTitle = configData[mfg]['PM'].title.split(' ')[0]; // Display name
        if(mfg === 'Boston') mfgTitle = 'Boston Scientific';
        if(mfg === 'NihonKohden') mfgTitle = 'Nihon Kohden';
        document.getElementById('selected-mfg-title').innerText = mfgTitle;
        showScreen('screen-device');
    }

    function selectDevice(deviceType) {
        currentDevice = deviceType;
        const conf = configData[currentMfg][currentDevice];
        document.getElementById('checklist-title').innerText = conf.title;
        renderChecklists(conf);
        renderMeasurementTables(conf);
        setupSignatures();
        showScreen('screen-checklist');
        
        // JADIAリンク用ID付与（特別処理）
        let jadiaCb = document.querySelector('#check-list-1 input[type="checkbox"]');
        if(jadiaCb) jadiaCb.id = 'check-jadia';
        
        loadPatientData();
    }

    function switchTab(el, tabId) {
        document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function switchActionTab(actionId) {
        document.querySelectorAll('.action-tab').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.action-content').forEach(el => el.style.display = 'none');
        
        if (actionId === 'action-save') {
            document.getElementById('tab-btn-save').classList.add('active');
            document.getElementById('action-save').style.display = 'block';
        } else if (actionId === 'action-export') {
            document.getElementById('tab-btn-export').classList.add('active');
            document.getElementById('action-export').style.display = 'block';
        }
    }

    function manualSave() {
        const patientId = document.getElementById('patient-id').value.trim();
        if (!patientId) {
            alert("患者IDが入力されていません。保存には患者IDが必要です。");
            document.getElementById('patient-id').focus();
            return;
        }
        autoSave();
        alert(`患者ID: ${patientId} のデータを一時保存しました。`);
    }

    function renderChecklists(conf) {
        for (let i = 1; i <= 4; i++) {
            const listDiv = document.getElementById('check-list-' + i);
            listDiv.innerHTML = '';
            conf.tabs['tab'+i].forEach((text, idx) => {
                const idStr = `check-t${i}-${idx}`;
                listDiv.innerHTML += `
                    <label class="check-item">
                        <input type="checkbox" id="${idStr}" onchange="autoSave()">
                        <span>${text}</span>
                    </label>
                `;
            });
        }
    }

    function renderMeasurementTables(conf) {
        let thead = `<tr><th>計測項目</th>${conf.measureColumns.map(c => `<th>${c}</th>`).join('')}</tr>`;
        
        let preBody = conf.measureRows.map(row => {
            let cells = conf.measureColumns.map((col, idx) => `<td><input type="text" class="measure-input" id="pre-${row.id}-${idx}" onchange="autoSave()"></td>`).join('');
            return `<tr><td>${row.label}</td>${cells}</tr>`;
        }).join('');
        document.getElementById('measurements-pre').innerHTML = `<table class="measure-table">${thead}<tbody>${preBody}</tbody></table>`;

        let postBody = conf.measureRows.map(row => {
            let cells = conf.measureColumns.map((col, idx) => `
                <td>
                    <div style="font-size:0.8em; color:gray;">前: <span id="disp-pre-${row.id}-${idx}">-</span></div>
                    <input type="text" class="measure-input" id="post-${row.id}-${idx}" onchange="autoSave()">
                </td>`).join('');
            return `<tr><td>${row.label}</td>${cells}</tr>`;
        }).join('');
        document.getElementById('measurements-post').innerHTML = `<table class="measure-table">${thead}<tbody>${postBody}</tbody></table>`;
    }

    function getSaveKey() {
        const id = document.getElementById('patient-id').value.trim() || 'NO_ID';
        return `mriData_${currentMfg}_${currentDevice}_${id}`;
    }

    function autoSave() {
        if (!document.getElementById('patient-id').value.trim()) return;
        
        const conf = configData[currentMfg][currentDevice];
        conf.measureRows.forEach(row => {
            conf.measureColumns.forEach((col, idx) => {
                let preVal = document.getElementById(`pre-${row.id}-${idx}`).value;
                let disp = document.getElementById(`disp-pre-${row.id}-${idx}`);
                if(disp) disp.innerText = preVal || '-';
            });
        });

        let data = {
            name: document.getElementById('patient-name').value,
            orderDate: document.getElementById('exam-order-date').value,
            execDate: document.getElementById('exam-exec-date').value,
            cardImg: cardImageBase64,
            checkboxes: {},
            measures: {}
        };

        document.querySelectorAll('input[type="checkbox"]').forEach(cb => { data.checkboxes[cb.id] = cb.checked; });
        document.querySelectorAll('.measure-input').forEach(inp => { data.measures[inp.id] = inp.value; });

        localStorage.setItem(getSaveKey(), JSON.stringify(data));
    }

    function loadPatientData() {
        const id = document.getElementById('patient-id').value.trim();
        if (!id) return;
        
        // JADIA ID再付与
        let jadiaCb = document.querySelector('#check-list-1 input[type="checkbox"]');
        if(jadiaCb) jadiaCb.id = 'check-jadia';
        
        let saved = localStorage.getItem(getSaveKey());
        if (saved) {
            let data = JSON.parse(saved);
            document.getElementById('patient-name').value = data.name || '';
            document.getElementById('exam-order-date').value = data.orderDate || '';
            document.getElementById('exam-exec-date').value = data.execDate || '';
            
            cardImageBase64 = data.cardImg || "";
            if (cardImageBase64) {
                document.getElementById('card-image-preview').src = cardImageBase64;
                document.getElementById('card-image-preview').style.display = 'block';
            } else {
                document.getElementById('card-image-preview').style.display = 'none';
            }

            for (let k in data.checkboxes) { if (document.getElementById(k)) document.getElementById(k).checked = data.checkboxes[k]; }
            for (let k in data.measures) { if (document.getElementById(k)) document.getElementById(k).value = data.measures[k]; }
            
            ['sig-ce', 'sig-rad', 'sig-doc'].forEach(sid => {
                let sigData = localStorage.getItem(`${getSaveKey()}_${sid}`);
                let cvs = document.getElementById(sid);
                let ctx = cvs.getContext('2d');
                ctx.clearRect(0, 0, cvs.width, cvs.height); // 一旦クリア
                
                if (sigData) {
                    let img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = sigData;
                    
                    let btn = document.getElementById(`btn-save-${sid}`);
                    if(btn) { btn.innerHTML = "✓ 保存済"; btn.style.background = "#17a2b8"; }
                } else {
                    let btn = document.getElementById(`btn-save-${sid}`);
                    if(btn) { btn.innerHTML = "✓ 保存"; btn.style.background = "#28a745"; }
                }
            });
            autoSave();
        } else {
            // 新規患者IDが入力された場合、現在入力中のデータをクリアせず、そのIDとして保存する
            autoSave();
        }
    }

    function clearCurrentData() {
        if(confirm('現在の入力データをすべてクリアしますか？')) {
            localStorage.removeItem(getSaveKey());
            localStorage.removeItem(`${getSaveKey()}_sig-ce`);
            localStorage.removeItem(`${getSaveKey()}_sig-rad`);
            localStorage.removeItem(`${getSaveKey()}_sig-doc`);
            document.getElementById('patient-name').value = '';
            document.getElementById('exam-order-date').value = '';
            document.getElementById('exam-exec-date').value = '';
            loadPatientData();
        }
    }

    function handleImageUpload(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX = 600; // Resize width
                let w = img.width, h = img.height;
                if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } 
                else { if(h > MAX) { w *= MAX/h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                cardImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('card-image-preview').src = cardImageBase64;
                document.getElementById('card-image-preview').style.display = 'block';
                autoSave();
            }
            img.src = ev.target.result;
        }
        reader.readAsDataURL(file);
    }

    function setupSignatures() {
        ['sig-ce', 'sig-rad', 'sig-doc'].forEach(sid => {
            let cvs = document.getElementById(sid);
            cvs.width = 300; cvs.height = 100;
            let ctx = cvs.getContext('2d');
            ctx.lineWidth = 2; ctx.strokeStyle = 'black';
            
            const getPos = (e) => {
                let rect = cvs.getBoundingClientRect();
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            cvs.onmousedown = cvs.ontouchstart = (e) => {
                e.preventDefault(); isDrawing = true;
                let pos = getPos(e);
                ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
                
                // ペンを入れたら「保存済」ステータスを解除
                let btn = document.getElementById(`btn-save-${sid}`);
                if(btn) { btn.innerHTML = "✓ 保存"; btn.style.background = "#28a745"; }
            };
            cvs.onmousemove = cvs.ontouchmove = (e) => {
                e.preventDefault();
                if(isDrawing) { let pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
            };
            cvs.onmouseup = cvs.ontouchend = () => { isDrawing = false; };
        });
    }

    function saveSignature(sid) {
        if (!document.getElementById('patient-id').value.trim()) return alert("先に患者IDを入力してください");
        let cvs = document.getElementById(sid);
        
        let bgCanvas = document.createElement('canvas');
        bgCanvas.width = cvs.width; bgCanvas.height = cvs.height;
        let bctx = bgCanvas.getContext('2d');
        bctx.fillStyle = "#ffffff"; // Make background white for Excel
        bctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        bctx.drawImage(cvs, 0, 0);
        
        let sigData = bgCanvas.toDataURL('image/jpeg', 1.0);
        localStorage.setItem(`${getSaveKey()}_${sid}`, sigData);
        
        let btn = document.getElementById(`btn-save-${sid}`);
        if(btn) {
            btn.innerHTML = "✓ 保存済"; btn.style.background = "#17a2b8";
        }
    }
    
    function clearSignature(sid) {
        let cvs = document.getElementById(sid);
        cvs.getContext('2d').clearRect(0, 0, cvs.width, cvs.height);
        localStorage.removeItem(`${getSaveKey()}_${sid}`);
        let btn = document.getElementById(`btn-save-${sid}`);
        if(btn) { btn.innerHTML = "✓ 保存"; btn.style.background = "#28a745"; }
    }

    async function exportToExcel() {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Checklist');
        const conf = configData[currentMfg][currentDevice];

        ws.columns = [ { width: 45 }, { width: 15 }, { width: 15 }, { width: 15 }, { width: 15 } ];
        let rowNum = 1;

        const addRow = (values, isHeader=false) => {
            let row = ws.addRow(values);
            if(isHeader) {
                row.eachCell(cell => { cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFD9E1F2'}}; cell.font = {bold:true}; });
            }
            rowNum++; return row;
        };

        addRow([conf.title, "", "", "", ""], true);
        ws.mergeCells(`A${rowNum-1}:E${rowNum-1}`);

        addRow(["患者ID", document.getElementById('patient-id').value]);
        addRow(["患者名", document.getElementById('patient-name').value]);
        addRow(["MRI検査オーダー日", document.getElementById('exam-order-date').value]);
        addRow(["MRI検査実施日", document.getElementById('exam-exec-date').value]);
        addRow([]);

        // Add Image if exists
        if (cardImageBase64) {
            try {
                let imgId = wb.addImage({ base64: cardImageBase64.split(',')[1], extension: 'jpeg' });
                addRow(["■ MRI対応カード画像", "", "", "", ""], true);
                let imgRow = rowNum;
                ws.getRow(imgRow).height = 120;
                ws.addImage(imgId, { tl: { col: 1, row: imgRow-1 }, ext: { width: 200, height: 120 } });
                rowNum++; addRow([]);
            } catch(e) { console.error("Image Export Error:", e); }
        }

        // Loop through checkboxes
        for (let t = 1; t <= 4; t++) {
            let tabNames = ["① オーダ前", "② 検査前", "③ 検査時", "④ 検査後"];
            addRow([tabNames[t-1]], true);
            conf.tabs['tab'+t].forEach((txt, idx) => {
                let cb = document.getElementById(`check-t${t}-${idx}`);
                // Special handling for the JADIA link ID
                if(t===1 && idx===0) cb = document.getElementById('check-jadia');
                
                let mark = (cb && cb.checked) ? "☑" : "☐";
                let cleanTxt = txt.replace(/<[^>]*>?/gm, ''); // Strip HTML
                addRow([cleanTxt, mark]);
            });
            addRow([]);
        }

        // Attach Signatures
        const attachSig = (sid, title) => {
            let sigData = localStorage.getItem(`${getSaveKey()}_${sid}`);
            // If not saved but drawn, grab directly
            if(!sigData) {
                let cvs = document.getElementById(sid);
                let bg = document.createElement('canvas');
                bg.width = cvs.width; bg.height = cvs.height;
                let ctx = bg.getContext('2d');
                ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,bg.width,bg.height);
                ctx.drawImage(cvs,0,0);
                sigData = bg.toDataURL('image/jpeg', 1.0);
            }
            
            if(sigData && sigData.length > 1000) { // Make sure it's not empty white canvas
                let b64 = sigData.split(',')[1];
                let imgId = wb.addImage({ base64: b64, extension: 'jpeg' });
                addRow([title], true);
                let sr = rowNum;
                ws.getRow(sr).height = 60;
                ws.addImage(imgId, { tl: { col: 1, row: sr-1 }, ext: { width: 160, height: 50 } });
                rowNum++; addRow([]);
            }
        };

        attachSig('sig-ce', "■ 施行CE 署名");
        attachSig('sig-rad', "■ 放射線技師 署名");
        attachSig('sig-doc', "■ 医師 署名");

        const buffer = await wb.xlsx.writeBuffer();
        let fileName = `${conf.title}_${document.getElementById('patient-name').value}.xlsx`;
        saveAs(new Blob([buffer]), fileName);
    }

    window.onload = () => {
        document.getElementById('patient-id').value = ''; 
    };
</script>
</body>
</html>

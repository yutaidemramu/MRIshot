<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボストン PMチェックリスト (MRI検査)</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            line-height: 1.6; 
            margin: 0;
            padding: 20px;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h1 { 
            font-size: 22px; 
            color: #0056b3; 
            text-align: center; 
            border-bottom: 2px solid #0056b3; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
        
        /* Patient Info */
        .patient-info { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
            background: #e9ecef; 
            padding: 15px; 
            border-radius: 6px; 
        }
        .patient-info div { display: flex; flex-direction: column; }
        .patient-info label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .patient-info input, .patient-info select { 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 14px;
        }

        /* Tabs */
        .tabs { 
            display: flex; 
            border-bottom: 2px solid #0056b3; 
            margin-bottom: 20px; 
            flex-wrap: wrap;
        }
        .tab { 
            flex: 1; 
            padding: 12px 10px; 
            cursor: pointer; 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            border-bottom: none; 
            text-align: center; 
            font-weight: bold; 
            transition: 0.2s;
            font-size: 15px;
        }
        .tab.active { background: #0056b3; color: #fff; border-color: #0056b3; }
        .tab:hover:not(.active) { background: #e2e6ea; }
        
        /* Tab Content */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Checkbox Styles */
        h3 { font-size: 18px; color: #495057; border-left: 4px solid #0056b3; padding-left: 10px; margin-top: 0;}
        .check-item { 
            display: flex; 
            align-items: flex-start; 
            margin-bottom: 12px; 
            padding: 10px; 
            background: #f8f9fa; 
            border-radius: 4px; 
            border: 1px solid #eee;
            transition: background 0.2s;
        }
        .check-item:hover { background: #e9ecef; }
        .check-item input[type="checkbox"] { margin-top: 4px; margin-right: 12px; transform: scale(1.3); cursor: pointer; }
        .check-item label { cursor: pointer; width: 100%; display: block;}
        
        /* Measurements Grid */
        .measure-grid { 
            display: grid; 
            grid-template-columns: 2.5fr 1fr 1fr; 
            gap: 10px; 
            margin-top: 15px; 
            align-items: center; 
        }
        .measure-grid input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .measure-grid .header { font-weight: bold; background: #e9ecef; padding: 10px; text-align: center; border-radius: 4px; }
        .measure-grid label { font-size: 14px; }
        
        /* Buttons & Alerts */
        .btn-submit { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: #28a745; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 30px; 
            transition: 0.3s; 
        }
        .btn-submit:hover { background: #218838; }
        .alert { font-size: 14px; color: #dc3545; font-weight: bold; margin-top: 15px; padding: 10px; background: #f8d7da; border-radius: 4px; }
        
        /* Signature Canvas */
        .signature-container { margin-top: 20px; border: 1px solid #ccc; border-radius: 4px; background: #fff; padding: 10px; }
        .signature-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .signature-header label { font-weight: bold; font-size: 14px; color: #495057;}
        .signature-canvas { border: 1px dashed #aaa; width: 100%; height: 150px; cursor: crosshair; touch-action: none; background: #f8f9fa; border-radius: 4px;}
        .btn-clear { background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s;}
        .btn-clear:hover { background: #5a6268; }

        @media (max-width: 600px) {
            .patient-info { grid-template-columns: 1fr; }
            .tabs { flex-direction: column; }
            .tab { border-bottom: 1px solid #dee2e6; }
            .tab.active { border-bottom: 1px solid #0056b3; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>条件付きMRI対応PM MRI検査チェックリスト <br><small style="font-size:14px; color:#666;">（ボストン社 ACCOLADE, INGENIO®）</small></h1>
    
    <!-- 基本情報 -->
    <div class="patient-info">
        <div>
            <label>患者ID</label>
            <input type="text" placeholder="IDを入力">
        </div>
        <div>
            <label>患者名</label>
            <input type="text" placeholder="氏名を入力">
        </div>
        <div>
            <label>MRI検査オーダー日</label>
            <input type="date">
        </div>
        <div>
            <label>MRI検査実施日</label>
            <input type="date">
        </div>
    </div>

    <!-- タブメニュー -->
    <div class="tabs">
        <div class="tab active" onclick="openTab(event, 'tab1')">① オーダ前</div>
        <div class="tab" onclick="openTab(event, 'tab2')">② MRI検査前</div>
        <div class="tab" onclick="openTab(event, 'tab3')">③ MRI検査時</div>
        <div class="tab" onclick="openTab(event, 'tab4')">④ MRI検査後</div>
    </div>

    <!-- ① オーダ前 -->
    <div id="tab1" class="tab-content active">
        <h3>条件適応判断</h3>
        <div class="check-item"><input type="checkbox" id="c1_1"><label for="c1_1">患者様より条件付きMRI対応カードの提示がある</label></div>
        <div class="check-item"><input type="checkbox" id="c1_2"><label for="c1_2">患者様より条件付きMRIペースメーカの手帳の提示がある</label></div>
        <div class="check-item"><input type="checkbox" id="c1_3"><label for="c1_3">ペースメーカ植込み後6週間を超えている</label></div>
        <div class="check-item"><input type="checkbox" id="c1_4"><label for="c1_4">ペースメーカは胸部植え込みである</label></div>
        <div class="check-item"><input type="checkbox" id="c1_5"><label for="c1_5">本装置と併用可能なMRI対応機器以外の機器が植込まれていないこと</label></div>
        <div class="check-item"><input type="checkbox" id="c1_6"><label for="c1_6">MRI対応していないリード及びリードアダプタが植え込まれていない</label></div>
        <div class="check-item"><input type="checkbox" id="c1_7"><label for="c1_7">ペースメーカ本体と併用されているMRI対応リード以外の植え込み機器(以前使用していたリード等)が無い</label></div>
        <div class="check-item"><input type="checkbox" id="c1_8"><label for="c1_8">患者様にMRI検査日にPM手帳とカードを必ず持ってきてもらうよう伝える。</label></div>
        <div class="check-item"><input type="checkbox" id="c1_9"><label for="c1_9">MRI検査当日、ペースメーカチェックにおいて条件を満たしていないと撮影できないことがあると伝える。</label></div>
        <div class="check-item"><input type="checkbox" id="c1_10"><label for="c1_10">条件がクリアしていれば第2MRI（1301）へ連絡しオーダ日時をレントゲン技師に伝える。</label></div>
        <div class="check-item"><input type="checkbox" id="c1_11"><label for="c1_11">カルテ、Prof⇒インプラント⇒ペースメーカー装着日が記入されているか確認</label></div>
        <div class="check-item"><input type="checkbox" id="c1_12"><label for="c1_12">MRIカード持っていない場合は電子カルテでX-pを確認し外されたリードが残存していないことを確認する</label></div>
    </div>

    <!-- ② MRI検査前 -->
    <div id="tab2" class="tab-content">
        <h3>ペースメーカチェック</h3>
        <div class="check-item"><input type="checkbox" id="c2_1"><label for="c2_1">Bipolar Pacingである</label></div>
        
        <div class="measure-grid">
            <div class="header">計測項目</div><div class="header">心房</div><div class="header">心室</div>
            
            <label>リードインピーダンス <br><small>(200～2000 Ω)</small></label>
            <input type="text" placeholder="Ω (Bi/Uni)">
            <input type="text" placeholder="Ω (Bi/Uni)">
            
            <label>ペーシング閾値 <br><small>(2.0 V / 0.4 ms以下)</small></label>
            <input type="text" placeholder="V / 0.4ms">
            <input type="text" placeholder="V / 0.4ms">
            
            <label>波高値 <br><small>(横隔膜ツイッチング無)</small></label>
            <input type="text" placeholder="mV">
            <input type="text" placeholder="mV">
        </div>

        <h3 style="margin-top: 30px;">MRI撮像中モード指示</h3>
        <div class="patient-info">
            <div>
                <label>モード</label>
                <select>
                    <option value="">選択してください</option>
                    <option value="DOO">DOO</option>
                    <option value="VOO">VOO</option>
                    <option value="AOO">AOO</option>
                    <option value="ODO">ODO</option>
                </select>
            </div>
            <div>
                <label>レート <small>(30～120ppm ※65不可)</small></label>
                <input type="number" placeholder="ppm">
            </div>
        </div>
        <div class="alert">※上記測定条件満たしていない者はMRI撮影ができません。もし条件を満たせない場合は主治医に報告してください。</div>
    </div>

    <!-- ③ MRI検査時 -->
    <div id="tab3" class="tab-content">
        <h3>MRI撮影時チェック</h3>
        <div class="check-item"><input type="checkbox" id="c3_1"><label for="c3_1">撮像は側臥位ではない</label></div>
        <div class="check-item"><input type="checkbox" id="c3_2"><label for="c3_2">一軸あたりの最大勾配スルーレートが 200 T/m/s 以下</label></div>
        <div class="check-item"><input type="checkbox" id="c3_3"><label for="c3_3">全身 SAR 2.0 W/kg以下、頭部SAR 3.2W/kg 未満</label></div>
        <div class="check-item"><input type="checkbox" id="c3_4"><label for="c3_4">送信を行うローカルコイル(送受用・送信用)は、AP方向においてペーシングシステムと重ならないこと</label></div>
        <div class="check-item"><input type="checkbox" id="c3_5"><label for="c3_5">患者動態モニタリングを行えている</label></div>
        
        <div class="signature-container">
            <div class="signature-header">
                <label>放射線課 署名</label>
                <button type="button" class="btn-clear" onclick="padRad.clear()">クリア</button>
            </div>
            <canvas id="sigPadRad" class="signature-canvas"></canvas>
        </div>
    </div>

    <!-- ④ MRI検査後 -->
    <div id="tab4" class="tab-content">
        <h3>設定戻しの確認</h3>
        <div class="check-item"><input type="checkbox" id="c4_1"><label for="c4_1">設定戻しの確認を行った</label></div>
        <div class="check-item"><input type="checkbox" id="c4_2"><label for="c4_2">前データとの変動が無い事を確認した</label></div>

        <div class="measure-grid">
            <div class="header">計測項目</div><div class="header">心房</div><div class="header">心室</div>
            
            <label>リードインピーダンス</label>
            <input type="text" placeholder="Ω (Bi/Uni)">
            <input type="text" placeholder="Ω (Bi/Uni)">
            
            <label>ペーシング閾値</label>
            <input type="text" placeholder="V / ms">
            <input type="text" placeholder="V / ms">
            
            <label>波高値</label>
            <input type="text" placeholder="mV">
            <input type="text" placeholder="mV">
        </div>
        
        <div class="signature-container">
            <div class="signature-header">
                <label>医師署名</label>
                <button type="button" class="btn-clear" onclick="padDoc.clear()">クリア</button>
            </div>
            <canvas id="sigPadDoc" class="signature-canvas"></canvas>
        </div>

        <div style="margin-top: 30px; padding: 15px; background:#e9ecef; border-radius: 4px; font-size:13px;">
            <strong>詳細確認先：</strong> ボストンサイエンティフィックジャパン（株）<br>
            <strong>MRI専用フリーダイヤル：</strong> 0120-953-670
        </div>
    </div>

    <button class="btn-submit" onclick="alert('現在はプレビュー用です。入力データの保存機能などは今後追加可能です。')">チェック内容を保存する</button>
</div>

<script>
    let padRad, padDoc;

    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        
        // 全てのタブコンテンツを非表示
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        
        // 全てのタブの非アクティブ化
        tablinks = document.getElementsByClassName("tab");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].classList.remove("active");
        }
        
        // 選択されたタブを表示してアクティブにする
        document.getElementById(tabName).style.display = "block";
        
        // アニメーションのために少し遅らせてactiveクラスを付与
        setTimeout(function() {
            document.getElementById(tabName).classList.add("active");
            // サインタブが開かれた時にキャンバスのサイズを調整する
            if(tabName === 'tab3' && padRad) padRad.resize();
            if(tabName === 'tab4' && padDoc) padDoc.resize();
        }, 10);
        
        evt.currentTarget.classList.add("active");
    }

    class SignaturePad {
        constructor(canvasId) {
            this.canvas = document.getElementById(canvasId);
            if (!this.canvas) return;
            this.ctx = this.canvas.getContext('2d');
            this.isDrawing = false;
            this.lastX = 0;
            this.lastY = 0;
            
            this.startDrawing = this.startDrawing.bind(this);
            this.draw = this.draw.bind(this);
            this.stopDrawing = this.stopDrawing.bind(this);
            
            this.initEvents();
        }

        resize() {
            if (!this.canvas.offsetParent) return; // 画面に表示されていない時はスキップ
            const rect = this.canvas.getBoundingClientRect();
            this.canvas.width = rect.width;
            this.canvas.height = rect.height;
            this.ctx.strokeStyle = '#000'; // ペンの色
            this.ctx.lineWidth = 3;        // ペンの太さ
            this.ctx.lineCap = 'round';
            this.ctx.lineJoin = 'round';
        }

        getMousePos(evt) {
            const rect = this.canvas.getBoundingClientRect();
            return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
        }

        getTouchPos(evt) {
            const rect = this.canvas.getBoundingClientRect();
            return { x: evt.touches[0].clientX - rect.left, y: evt.touches[0].clientY - rect.top };
        }

        startDrawing(e) {
            this.isDrawing = true;
            const pos = e.type.includes('mouse') ? this.getMousePos(e) : this.getTouchPos(e);
            this.lastX = pos.x;
            this.lastY = pos.y;
        }

        draw(e) {
            if (!this.isDrawing) return;
            e.preventDefault(); // スマホでのスクロールを防止
            const pos = e.type.includes('mouse') ? this.getMousePos(e) : this.getTouchPos(e);
            
            this.ctx.beginPath();
            this.ctx.moveTo(this.lastX, this.lastY);
            this.ctx.lineTo(pos.x, pos.y);
            this.ctx.stroke();
            
            this.lastX = pos.x;
            this.lastY = pos.y;
        }

        stopDrawing() {
            this.isDrawing = false;
            this.ctx.beginPath();
        }

        initEvents() {
            this.canvas.addEventListener('mousedown', this.startDrawing);
            this.canvas.addEventListener('mousemove', this.draw);
            this.canvas.addEventListener('mouseup', this.stopDrawing);
            this.canvas.addEventListener('mouseout', this.stopDrawing);

            this.canvas.addEventListener('touchstart', this.startDrawing, { passive: false });
            this.canvas.addEventListener('touchmove', this.draw, { passive: false });
            this.canvas.addEventListener('touchend', this.stopDrawing);
            this.canvas.addEventListener('touchcancel', this.stopDrawing);
        }

        clear() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
    }

    // ページ読み込み時に各サインパッドを初期化
    window.addEventListener('DOMContentLoaded', () => {
        padRad = new SignaturePad('sigPadRad');
        padDoc = new SignaturePad('sigPadDoc');
    });

    // 画面サイズ変更時にも対応
    window.addEventListener('resize', () => {
        if (document.getElementById('tab3').classList.contains('active')) {
            padRad.resize(); 
        }
        if (document.getElementById('tab4').classList.contains('active')) {
            padDoc.resize(); 
        }
    });
</script>

</body>
</html>
